<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>CONTENT · Lucas Casagrande</title>
<style>
:root{--bg:#0b0b0d;--card:#15151a;--muted:#92929d;--line:#282832;--text:#f6f6f7;--accent:#ffffff;--good:#a7f3c5;--warn:#ffd88a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.app{max-width:760px;margin:auto;padding:18px 14px 96px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 80%,transparent);padding:8px 0 16px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font-size:30px;line-height:.95;margin:0;letter-spacing:-1.2px} .sub{color:var(--muted);font-size:12px;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
button,a.btn{border:1px solid var(--line);background:#111116;color:#fff;border-radius:999px;padding:10px 13px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer}
button.active{background:#fff;color:#000;border-color:#fff} button.good{background:#183225;border-color:#2c5d3e;color:#d6ffe5}
.search{width:100%;background:#111116;border:1px solid var(--line);color:white;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
.filters{display:flex;gap:7px;overflow:auto;padding:10px 0 2px;scrollbar-width:none} .filters::-webkit-scrollbar{display:none}
.stats{font-size:12px;color:var(--muted);padding:10px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{font-size:10px;letter-spacing:.4px;border:1px solid var(--line);border-radius:999px;padding:5px 7px;color:#c8c8d0}
.tag.ready{color:#d8ffe6;border-color:#345f44;background:#17251c} .tag.idea{color:#ffe7b3;border-color:#614e2b;background:#251e11}
.title{font-weight:780;font-size:20px;line-height:1.1;letter-spacing:-.35px;margin:0 0 10px}
.hook{font-size:17px;line-height:1.35;margin:12px 0;font-weight:650}
.fact{color:#dedee3;line-height:1.42;background:#101014;border-left:3px solid #666;padding:10px 12px;border-radius:8px;margin:10px 0}
.beats{padding-left:21px;line-height:1.42} .beats li{margin:7px 0}
.close{font-weight:700;line-height:1.35;margin:12px 0}
.graphics{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0} .graphic{font-size:11px;padding:7px 9px;background:#0f0f13;border:1px dashed #42424c;border-radius:9px}
.card-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px} .card-buttons button,.card-buttons a{flex:1;min-width:115px;text-align:center}
.details{display:none;border-top:1px solid var(--line);padding-top:5px;margin-top:8px} .card.open .details{display:block}
.small{font-size:11px;color:var(--muted)} .empty{padding:40px 10px;text-align:center;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);padding:16px;align-items:flex-end;justify-content:center}
.modal.open{display:flex} .sheet{background:#16161b;border:1px solid var(--line);border-radius:24px 24px 14px 14px;padding:16px;width:min(760px,100%);max-height:88vh;overflow:auto}
label{display:block;font-size:11px;color:var(--muted);margin:11px 0 5px} textarea{width:100%;min-height:75px;background:#0f0f13;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit}
.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(11,11,13,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:30}
.footerin{max-width:760px;margin:auto;display:flex;gap:8px} .footerin a{flex:1;text-align:center}
@media(min-width:700px){.card{padding:19px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div><h1>CONTENT</h1><div class="sub">Lucas Casagrande · LO‑FI shooting library</div></div><div class="small" id="localState"></div></div>
    <div class="actions">
      <button id="filterReady" class="active">🔥 Para filmar</button>
      <button id="filterAll">Todo</button>
      <button id="resetBtn">Reset local</button>
    </div>
    <input class="search" id="search" placeholder="Buscar idea, hook, ID…">
    <div class="filters">
      <button data-chip="PRACTICO">Práctico</button>
      <button data-chip="OPINION">Opinión</button>
      <button data-chip="COLLAB">Lucas × CHIMI</button>
      <button data-chip="RECORDED">Filmados</button>
      <button data-chip="IDEA">Ideas</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <main id="list"></main>
</div>
<div class="modal" id="modal">
 <div class="sheet">
  <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b id="editTitle">Editar</b><button id="closeModal">Cerrar</button></div>
  <label>HOOK</label><textarea id="eHook"></textarea>
  <label>FACT</label><textarea id="eFact"></textarea>
  <label>BEAT 1</label><textarea id="eB1"></textarea>
  <label>BEAT 2</label><textarea id="eB2"></textarea>
  <label>BEAT 3</label><textarea id="eB3"></textarea>
  <label>CIERRE</label><textarea id="eClose"></textarea>
  <div class="card-buttons"><button class="good" id="saveEdit">Guardar en este teléfono</button></div>
  <p class="small">Este prototipo guarda ediciones en localStorage. El Master de Drive sigue siendo la fuente de verdad hasta conectar writeback.</p>
 </div>
</div>
<div class="footer"><div class="footerin">
<a class="btn" href="https://docs.google.com/spreadsheets/d/1RZr3tL74f0mrB7Gxwb8qg6Q2S94MIr2WPS7vJ6PVIDg/edit" target="_blank">📊 Master</a>
<a class="btn" href="https://drive.google.com/drive/folders/1Nof2AnkaNgU-PB1yX44k611B1XduDwbW" target="_blank">🖼 Multimedia</a>
</div></div>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
